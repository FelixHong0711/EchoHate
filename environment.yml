# Conda environment mirroring Deakin HPC `rag_v8_gpu` (queried 2026-10-02).
# Preferred on cluster: use the existing env (CONDA_ENV=rag_v8_gpu).
# Local / fresh machine:
#   conda env create -f environment.yml
#   conda activate echohate
name: echohate
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # CUDA 12.1 wheel (HPC reports torch 2.5.1+cu121)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - -r requirements.txt
