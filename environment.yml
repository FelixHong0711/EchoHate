#   conda env create -f environment.yml
#   conda activate echohate
name: echohate
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # CUDA 12.1 wheel
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - -r requirements.txt
